<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192b32">
  <meta name="description" content="永久死亡と再起を備えた、初代風ハードコア・モンスターRPG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>LOST ROUTE — Hardcore RPG</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">LR</div>
        <div>
          <div class="brand-name">LOST ROUTE</div>
          <div class="brand-sub">HARDCORE MONSTER RPG</div>
        </div>
      </div>
      <div id="save-indicator" class="save-indicator"><span class="save-dot"></span><span>準備中</span></div>
    </header>
    <main id="game-root" class="game-root" aria-live="polite">
      <div class="loading-state">冒険の記録を読み込んでいます…</div>
    </main>
    <footer class="app-footer">
      <span>LOST ROUTE <span class="muted">/ FIRST BUILD</span></span>
      <span>あなたの選択は、記録に残る。</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="game-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
